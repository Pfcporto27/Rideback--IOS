workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          echo "Building iOS App..."
          xcodebuild build -scheme RideBack -destination 'generic/platform=iOS'
    artifacts:
      - "*.ipa"
      - "build/ios/ipa/*.ipa"

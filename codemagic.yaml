workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS app
        script: |
          echo "Building iOS App..."
          xcodebuild build -scheme RideBack -destination 'generic/platform=iOS'
    artifacts:
      - build/ios/ipa/*.ipa
      - *.ipa

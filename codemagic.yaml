workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Native iOS App
        script: |
          set -e
          echo "Compilando código Swift..."
          
          mkdir -p RideBack.app
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -o RideBack.app/RideBack \
            RideBackApp.swift \
            ContentView.swift \
            FallDetectorManager.swift \
            QRCodeGenerator.swift \
            RecoveryStorage.swift
          
          cat << 'EOF' > RideBack.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>RideBack</string>
              <key>CFBundleIdentifier</key>
              <string>com.rideback.app</string>
              <key>CFBundleName</key>
              <string>RideBack</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>NSMotionUsageDescription</key>
              <string>RideBack utiliza el acelerómetro para detectar caídas.</string>
          </dict>
          EOF

          mkdir -p Payload
          cp -r RideBack.app Payload/
          zip -r RideBack-iOS.zip Payload RideBack.app
          zip -r RideBack-iOS.ipa Payload
    artifacts:
      - "*.zip"
      - "*.ipa"

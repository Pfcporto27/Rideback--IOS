workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App with Xcode
        script: |
          echo "Building iOS App with new Xcode project..."
          xcodebuild archive \
            -project RideBack.xcodeproj \
            -scheme RideBack \
            -archivePath build/RideBack.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          cp -r build/RideBack.xcarchive/Products/Applications/RideBack.app Payload/
          zip -r RideBack.ipa Payload
    artifacts:
      - "*.ipa"
      - Payload/*.ipa
